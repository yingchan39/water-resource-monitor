name: Deploy to GitHub Pages (with Live Water Resource Data Sync)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  schedule:
    # 每 2 小時自動抓取最新「水資源」新聞與立法院發布消息並重新發布至 GitHub Pages
    - cron: '15 */2 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch latest news & Legislative Yuan data into public/data
        run: npm run build:data

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
