name: Magic Conch Monitor - Sync & Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  schedule:
    # 每 2 小時自動抓取最新新聞、立法院與 20 個政府機關發布消息並更新至 GitHub Pages
    - cron: '15 */2 * * *'

permissions:
  contents: write

concurrency:
  group: 'gh-pages-deploy'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch latest Zone 1, Zone 2 & Zone 3 (20 Government Agencies) data
        run: npm run build:data

      - name: Deploy public/ to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true
          commit_message: 'chore(data): sync Magic Conch news, Parliament & Government updates'
